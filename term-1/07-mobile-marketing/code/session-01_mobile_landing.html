<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garam Chai Co. · Order in 30 minutes</title>
<!-- Mobile-first landing page for a mobile campaign. Prepared by Hamna Zahid Khan, Junior Lecturer.
     Thumb-friendly buttons, click-to-call, WhatsApp, light images and one clear goal. -->
<style>
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0A0716;color:#F5EEFF;font-size:16px;line-height:1.5}
  header,section{padding:20px}
  h1{font-size:26px;margin:0 0 8px;color:#FCD34D}
  p{margin:0 0 16px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;font-size:18px;font-weight:700;text-decoration:none;margin:12px 0}
  .primary{background:#FF6B1A;color:#0A0716}
  .secondary{border:2px solid #A78BFA;color:#F5EEFF}
  .card{background:#1b1430;border-radius:12px;padding:16px;margin:12px 0}
  .price{font-size:20px;color:#FCD34D;font-weight:700}
  .sticky{position:sticky;bottom:0;background:#0A0716;padding:8px 20px;border-top:1px solid #3b3355}
  small{font-size:14px;color:#A78BFA}
</style>
</head>
<body>
<header>
  <h1>Karak chai at your door in 30 minutes ☕</h1>
  <p>Fresh, hot and made to order in Gulshan &amp; Johar, Karachi. Cash on delivery.</p>
  <img src="hero.webp" alt="Cup of karak chai with paratha" width="360" height="200" loading="lazy" style="width:100%;height:auto;border-radius:12px">
</header>
<section>
  <div class="card"><b>Karak Chai Flask (4 cups)</b><p class="price">PKR 650</p></div>
  <div class="card"><b>Chai + 2 Parathas Deal</b><p class="price">PKR 550</p></div>
  <a class="btn primary" href="https://wa.me/920000000000?text=Hi%2C%20I%20want%20to%20order%20chai%20(QR%20poster)">💬 Order on WhatsApp</a>
  <a class="btn secondary" href="tel:+920000000000">📞 Call to order</a>
  <small>Open 4 pm – 2 am · Free delivery over PKR 1,000</small>
</section>
<div class="sticky"><a class="btn primary" href="https://wa.me/920000000000">Order now</a></div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Diploma in Digital Marketing banner, prepared by Hamna Zahid Khan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0716"/>
      <stop offset="0.6" stop-color="#140B2B"/>
      <stop offset="1" stop-color="#0A0716"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="0.5" stop-color="#FF6B1A"/>
      <stop offset="1" stop-color="#FCD34D"/>
      <animate attributeName="x1" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1040" cy="150" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;185;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="140" fill="url(#vglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- stars -->
  <g fill="#F5EEFF">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="270" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="270" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Sagittarius arrow = growth line -->
  <g transform="translate(900,215)">
    <polyline points="0,0 60,-30 110,-15 170,-80 230,-120" fill="none" stroke="url(#fire)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" values="400;0;0" dur="4s" repeatCount="indefinite"/>
    </polyline>
    <polygon points="230,-120 205,-118 222,-100" fill="#FCD34D">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.6;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <g fill="#A78BFA">
      <rect x="0" y="10" width="26" height="30" rx="3"/>
      <rect x="45" y="-5" width="26" height="45" rx="3"/>
      <rect x="90" y="5" width="26" height="35" rx="3"/>
      <rect x="135" y="-35" width="26" height="75" rx="3"/>
      <rect x="180" y="-60" width="26" height="100" rx="3" fill="#FF6B1A"/>
    </g>
  </g>
  <text x="70" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#FCD34D">TWO-TERM STUDY REPOSITORY</text>
  <text x="70" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#fire)">Diploma in Digital Marketing</text>
  <text x="70" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#F5EEFF" opacity="0.9">SEO · Paid Ads · Social · Email · Mobile · Analytics · AI · Privacy</text>
  <text x="70" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#A78BFA">Prepared by Hamna Zahid Khan, Junior Lecturer</text>
  <rect x="70" y="135" width="0" height="3" fill="#F43F5E">
    <animate attributeName="width" values="0;380;380" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
